name: EVIDA appointment reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger confirmed appointment reminders
        env:
          APP_URL: ${{ secrets.EVIDA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" || (echo "Missing EVIDA_APP_URL secret" && exit 1)
          test -n "$CRON_SECRET" || (echo "Missing CRON_SECRET secret" && exit 1)
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/appointment-reminders"
